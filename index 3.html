<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0C;
    --card:#151311;
    --card-line:#2A2620;
    --gold:#C9A24B;
    --gold-soft:#8A6E2F;
    --ivory:#F3EFE6;
    --ivory-dim:#B9B2A2;
    --error:#B4543A;
    --yes:#5C8A5C;
    --no:#B4543A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:32px 16px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 4px;
  }
  .sub{color:var(--ivory-dim);font-size:14px;margin:0 0 32px;}

  /* Password gate */
  #gate{
    max-width:360px;
    margin:80px auto;
    text-align:center;
  }
  #gate input{
    width:100%;
    background:transparent;
    border:1px solid var(--card-line);
    color:var(--ivory);
    font-size:16px;
    padding:12px;
    margin-bottom:12px;
    text-align:center;
    outline:none;
  }
  #gate input:focus{border-color:var(--gold);}
  #gate button{
    width:100%;
    padding:12px;
    background:var(--gold);
    border:none;
    color:#0B0B0C;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
  }
  #gate .err{color:var(--error);font-size:13px;margin-top:10px;}

  .hidden{display:none !important;}

  /* Stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:12px;
    margin-bottom:28px;
  }
  .stat{
    border:1px solid var(--card-line);
    padding:16px;
    text-align:center;
  }
  .stat .num{
    font-family:'Cormorant Garamond', serif;
    font-size:32px;
    color:var(--gold);
  }
  .stat .label{
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    margin-top:4px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  th{
    text-align:left;
    padding:10px 12px;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    border-bottom:1px solid var(--card-line);
  }
  td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    vertical-align:top;
  }
  .badge{
    display:inline-block;
    padding:3px 10px;
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border-radius:2px;
  }
  .badge.yes{background:rgba(92,138,92,0.15);color:var(--yes);}
  .badge.no{background:rgba(180,84,58,0.15);color:var(--no);}
  .dim{color:var(--ivory-dim);}
  .empty{
    text-align:center;
    color:var(--ivory-dim);
    padding:60px 20px;
    font-size:14px;
  }
  .refresh-btn{
    background:transparent;
    border:1px solid var(--card-line);
    color:var(--ivory-dim);
    padding:8px 16px;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    margin-bottom:20px;
  }
  .refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
</style>
</head>
<body>

<div id="gate">
  <h1>Dashboard</h1>
  <p class="sub">Enter password to view RSVPs</p>
  <input type="password" id="pw-input" placeholder="Password">
  <button id="pw-submit">Enter</button>
  <p class="err hidden" id="pw-err">Incorrect password.</p>
</div>

<div class="wrap hidden" id="content">
  <h1>RSVP Responses</h1>
  <p class="sub">Doctoral Celebration — Dec 11, 2026</p>

  <button class="refresh-btn" id="refresh-btn">Refresh</button>

  <div class="stats" id="stats"></div>

  <table id="table">
    <thead>
      <tr>
        <th>Guest</th>
        <th>Status</th>
        <th>Guest of Guest</th>
        <th>Dietary</th>
        <th>Submitted</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div class="empty hidden" id="empty-state">No RSVPs yet. Once your guests respond, they'll show up here.</div>
</div>

<script>
// Change this password before sharing the dashboard link with only yourself.
const DASHBOARD_PASSWORD = "legacy2026";

const gate = document.getElementById('gate');
const content = document.getElementById('content');
const pwInput = document.getElementById('pw-input');
const pwSubmit = document.getElementById('pw-submit');
const pwErr = document.getElementById('pw-err');

pwSubmit.addEventListener('click', tryLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

function tryLogin(){
  if (pwInput.value === DASHBOARD_PASSWORD) {
    gate.classList.add('hidden');
    content.classList.remove('hidden');
    loadResponses();
  } else {
    pwErr.classList.remove('hidden');
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadResponses);

async function loadResponses(){
  const statsEl = document.getElementById('stats');
  const tbody = document.getElementById('table-body');
  const emptyState = document.getElementById('empty-state');
  tbody.innerHTML = '';

  try {
    const listResult = await window.storage.list('rsvp:', true);
    const keys = listResult ? listResult.keys : [];

    if (!keys || keys.length === 0) {
      emptyState.classList.remove('hidden');
      document.getElementById('table').classList.add('hidden');
      statsEl.innerHTML = '';
      return;
    }

    document.getElementById('table').classList.remove('hidden');
    emptyState.classList.add('hidden');

    const records = [];
    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (res && res.value) records.push(JSON.parse(res.value));
      } catch (e) { /* skip unreadable key */ }
    }

    records.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    const yesCount = records.filter(r => r.attending === 'yes').length;
    const noCount = records.filter(r => r.attending === 'no').length;
    const plusOnes = records.filter(r => r.attending === 'yes' && r.bringingPlusOne).length;
    const totalHeads = yesCount + plusOnes;

    statsEl.innerHTML = `
      <div class="stat"><div class="num">${totalHeads}</div><div class="label">Total Attending</div></div>
      <div class="stat"><div class="num">${yesCount}</div><div class="label">Accepted</div></div>
      <div class="stat"><div class="num">${plusOnes}</div><div class="label">Plus Ones</div></div>
      <div class="stat"><div class="num">${noCount}</div><div class="label">Declined</div></div>
    `;

    records.forEach(r => {
      const tr = document.createElement('tr');
      const submitted = r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
      tr.innerHTML = `
        <td>${escapeHtml(r.guestName || '—')}</td>
        <td><span class="badge ${r.attending === 'yes' ? 'yes' : 'no'}">${r.attending === 'yes' ? 'Attending' : 'Declined'}</span></td>
        <td>${r.bringingPlusOne && r.plusOneName ? escapeHtml(r.plusOneName) : '<span class="dim">—</span>'}</td>
        <td>${r.dietary ? escapeHtml(r.dietary) : '<span class="dim">—</span>'}</td>
        <td class="dim">${submitted}</td>
      `;
      tbody.appendChild(tr);
    });

  } catch (err) {
    tbody.innerHTML = '';
    emptyState.textContent = 'Could not load responses. Try refreshing.';
    emptyState.classList.remove('hidden');
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
